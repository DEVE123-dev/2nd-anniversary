<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2 Years – Anniversary</title>
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#fff0f5">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Hero Section -->
  <section class="hero">
    <h1>2 Years.</h1>
    <p class="date">August 25</p>
    <p class="tagline">Celebrating two years together.</p>
    <button id="startStory">Let’s Go</button>
  </section>

  <!-- Photo Showcase -->
  <section class="showcase" id="showcase">
    <h2>Our Photos</h2>
    <div class="featured">
      <img src="images/featured.jpg" alt="Featured Memory">
    </div>
    <div class="collage">
      <img src="images/image1.jpg" alt="Memory 1" class="gallery-photo">
      <img src="images/image2.jpg" alt="Memory 2" class="gallery-photo">
      <img src="images/image3.jpg" alt="Memory 3" class="gallery-photo">
      <!-- Add more -->
    </div>
  </section>

  <!-- Timeline -->
  <section class="timeline">
    <h2>Two Years</h2>
    <ul>
      <li><span>The beginning.</span></li>
      <li><span>That random day.</span></li>
